plugins {
    id 'com.android.application'
}

android {
    namespace 'com.excessiverain.selenoatlas'
    compileSdk 34

    defaultConfig {
        applicationId 'com.excessiverain.selenoatlas'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.3.0'
    }

    signingConfigs {
        release {
            // 本地侧载：复用 Android debug keystore，保证 APK 可安装。
            // GitHub Actions 的 workflow 会在构建前确保该文件存在。
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

def webAsset = rootProject.file('../web/moon_atlas.html')
def assetsDir = layout.projectDirectory.dir('src/main/assets')

tasks.register('copyWebAsset', Copy) {
    from(webAsset)
    into(assetsDir)
    doFirst {
        if (!webAsset.exists()) {
            throw new GradleException("Missing web asset: ${webAsset}. Run this project from the repository root or ensure web/moon_atlas.html exists.")
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'copyWebAsset'
}
