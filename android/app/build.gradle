plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv('RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS') ?: 'selenoatlas'
def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD') ?: releaseStorePassword

android {
    namespace 'com.excessiverain.selenoatlas'
    compileSdk 34

    defaultConfig {
        applicationId 'com.excessiverain.selenoatlas'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '1.5.2'
    }

    signingConfigs {
        release {
            if (releaseStorePath) {
                // CI: fixed release keystore restored from a GitHub Actions secret.
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else {
                // Local fallback only. CI must set RELEASE_STORE_FILE so all
                // published APKs share the same certificate.
                storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

def webAsset = rootProject.file('../web/moon_atlas.html')
def legalRoot = rootProject.file('..')
def assetsDir = layout.projectDirectory.dir('src/main/assets')

tasks.register('copyWebAsset', Copy) {
    from(webAsset)
    into(assetsDir)
    doFirst {
        if (!webAsset.exists()) {
            throw new GradleException("Missing web asset: ${webAsset}. Run this project from the repository root or ensure web/moon_atlas.html exists.")
        }
    }
}

tasks.register('copyLegalAssets', Copy) {
    from(legalRoot) {
        include 'LICENSE'
        include 'THIRD_PARTY_NOTICES.md'
        include 'AI_ASSISTANCE.md'
        rename { name ->
            if (name == 'LICENSE') return 'LICENSE.txt'
            return name.replace('.md', '.txt')
        }
    }
    into(new File(assetsDir.asFile, 'legal'))
    doFirst {
        ['LICENSE', 'THIRD_PARTY_NOTICES.md', 'AI_ASSISTANCE.md'].each { name ->
            if (!legalRoot.toPath().resolve(name).toFile().exists()) {
                throw new GradleException("Missing legal asset: ${name}")
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'copyWebAsset', 'copyLegalAssets'
}
