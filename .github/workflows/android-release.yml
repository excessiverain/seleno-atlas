name: Build 望月 SelenoAtlas APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WebView APK
    runs-on: ubuntu-latest
    env:
      APK_NAME: SelenoAtlas-${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.0' }}.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android platform and accept licenses
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          cd dist
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          ls -lh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelenoAtlas APK
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 望月 SelenoAtlas ${{ github.ref_name }} · 月面三维地名图
          body: |
            **望月 SelenoAtlas** · 月面三维地名图 · Lunar 3D Atlas

            望月 SelenoAtlas 是月面三维地名图的 Android WebView 版本。

            - 完全离线，无需网络权限
            - 系统语言适配：英文系统桌面名 `SelenoAtlas`，中文系统桌面名 `望月`
            - 修复手机端搜索联想栏过窄、无法显示完整地名的问题
            - 真实日照按设备当前时间估算月相与太阳直射方向（低精度、离线）
            - 1,778 个 IAU 月球地名，243 个精选标注
            - 支持搜索、详情、经纬网、真实日照、全月小地图
            - 适用于 Android 8.0+（minSdk 26）

            **安装**：下载 `SelenoAtlas-${{ github.ref_name }}.apk`，在手机上允许安装未知来源应用后安装。
            该 APK 使用 Android debug 签名，便于本地侧载；如需长期升级请自行替换正式签名。
          files: |
            dist/*.apk
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
